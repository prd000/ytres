[project]
name = "worker"
version = "0.1.0"
description = "ytres background worker — job queue + asyncio agent orchestrator"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "tenacity>=8.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
