services:
  # Next.js frontend
  - type: web
    name: ytres-web
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # Python async worker
  - type: worker
    name: ytres-worker
    runtime: python
    rootDir: worker
    buildCommand: pip install -e .
    startCommand: python -m worker.main
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: POLL_INTERVAL
        value: "2.0"
      - key: HEARTBEAT_INTERVAL
        value: "10.0"
      - key: WATCHDOG_INTERVAL
        value: "60.0"
      - key: STALE_TIMEOUT_SECONDS
        value: "90"
      - key: GRACE_SHUTDOWN_SECONDS
        value: "30.0"
