# ── Worker tuning ──────────────────────────────────────────────────────────────
# Adjust these per deployment; no secrets here — safe to commit.
[worker]
concurrency           = 5
poll_interval         = 2.0   # seconds between job-queue polls
heartbeat_interval    = 10.0  # must be well under stale_timeout_seconds / 2
watchdog_interval     = 60.0  # how often to scan for stale jobs
stale_timeout_seconds = 90    # job is reclaimable after this many seconds without a heartbeat
grace_shutdown_seconds = 30.0 # time allowed for in-flight jobs to finish on SIGTERM
coordinator_sweep_interval = 10.0 # how often to check for projects ready for coordinator review

# ── Research pipeline ──────────────────────────────────────────────────────────
[research]
context_ceiling_tokens = 100000  # self-imposed Pro-eval token ceiling per handler run; tunable

# ── Observability ──────────────────────────────────────────────────────────────
[observability]
langchain_tracing = true
langchain_project = "ytres"

# ── Search ─────────────────────────────────────────────────────────────────────
# Safe to commit — no secrets. Set provider API keys in .env / Render env vars.
[search]
web_provider          = "brave"   # "brave" | "tavily"  (swappable)
web_fallback_provider = ""        # "" = disabled (no auto-switch in v1)
results_per_query     = 10
timeout               = 20.0
max_retries           = 4
backoff_base          = 0.5
backoff_max           = 30.0
extraction_timeout    = 30.0
extraction_min_words  = 50        # raw_content/extraction below this → fall through to next extractor

# ── Report generation ──────────────────────────────────────────────────────────
[report]
report_source_cap   = 25     # server-side cap on number of sources (curated + auto)
report_source_chars = 4000   # per-source full_text truncation budget (chars)

# ── LLM ────────────────────────────────────────────────────────────────────────
# Safe to commit — no secrets. Set API keys in .env / Render env vars.
[llm]
base_url             = "https://api.deepseek.com/v1"
coordinator_model    = "deepseek-v4-pro"
worker_model         = "deepseek-v4-pro"
classifier_model     = "deepseek-v4-flash"
temperature          = 0.2
timeout              = 120.0
max_retries          = 3
embedding_model      = "text-embedding-3-small"
embedding_dimensions = 1536
